# The layer this bundle contributes when a profile lists it.
#
# `dsh plugin --profile <name> add ./integrations/deepseek-harness/dsh-plugin-ctx`
# appends `dsh-plugin-ctx` to the profile's bundle list; this patch is then
# applied in that order, before the profile's own cordis.patch.yml. A user
# overrides any of it by restating the whole row in their profile patch — a
# patch replaces a row's `config` rather than deep-merging it.
- insert:
    - id: ctx
      name: dsh-plugin-ctx
      config:
        # A ctxd you already run. Point this at your deployment, or set
        # `spawn: true` below to have the plugin start a private one.
        endpoint: http://127.0.0.1:8080
        # Left empty, the plugin falls back to $CTX_API_KEY — keep the secret
        # out of this file.
        apiKey: ''
        spawn: false
        ctxdPath: ctxd
        dataDir: ~/.ctx
        addr: 127.0.0.1:18080
        # Mirror every model-driven ctx_resolve into a run keyed by the DSH
        # session, so "what did this session read?" is answerable.
        sessionRuns: true
        toolPrefix: ctx_
        systemPromptSection: true
