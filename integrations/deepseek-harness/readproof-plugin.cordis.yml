# Local-development overlay: mount the plugin straight from this checkout,
# with no install and no profile of its own.
#
# `name` MUST be an absolute path. A patch file contributes configuration but
# does not change the profile directory the loader resolves module paths
# from, so a relative path here would be looked up under
# $DSH_HOME/profiles/<name>/ and not found (docs/user/develop/basic/index.md).
# Since only a row's `config` is `!!js`-interpolated, the path cannot be
# computed either — resolve it once and feed the result to dsh:
#
#   cd integrations/deepseek-harness/dsh-plugin-readproof && npm install && npm run build && cd -
#   sed "s#__READPROOF_REPO__#$PWD#" integrations/deepseek-harness/readproof-plugin.cordis.yml > /tmp/readproof-plugin.cordis.yml
#   npx @deepseek-ai/dsh web --patch /tmp/readproof-plugin.cordis.yml
#
# It names the built entry point rather than the package directory because
# Node's ESM resolver does not resolve a directory. Keep `npx tsc -w`
# running: the loader hot-replaces the plugin when that file changes, and
# every registration is a reversible Cordis effect, so the old tools are
# unregistered first.
- insert:
    - id: readproof
      name: '__READPROOF_REPO__/integrations/deepseek-harness/dsh-plugin-readproof/dist/src/index.js'
      config:
        # Start a private readproofd from this repository's `go build ./cmd/readproofd`
        # output instead of expecting one to already be running. Set
        # `spawn: false` and an `endpoint` to use a shared deployment.
        spawn: true
        readproofdPath: !!js >-
          process.env.READPROOFD_BIN?.trim() || 'readproofd'
        dataDir: !!js >-
          process.env.READPROOF_HOME?.trim() || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.readproof')
        addr: 127.0.0.1:18080
        sessionRuns: true
        toolPrefix: readproof_
