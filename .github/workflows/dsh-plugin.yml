name: DSH plugin

on:
  push:
    branches: [main]
  pull_request:

# This job only builds and tests; without an explicit block it would inherit
# the repository's default token permissions, which can be read/write.
permissions:
  contents: read

jobs:
  dsh-plugin:
    name: dsh-plugin-readproof build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The plugin's tests build readproofd and readproof from this
      # repository and drive a real server, so the Go toolchain is a test
      # dependency, not just a build one.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/dsh-plugin-readproof/package-lock.json

      # The plugin consumes @readproof/sdk as a file: dependency, so the SDK's
      # dist/ has to exist before the plugin's own build can resolve it.
      - name: Build the SDK the plugin depends on
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Install, build, and test the plugin
        working-directory: integrations/deepseek-harness/dsh-plugin-readproof
        run: |
          npm ci
          npm test
