name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here builds and tests, and none of them writes
# anything back. Without this block the workflow inherits the repository
# default, which can be read/write — a token a compromised dependency could
# use to push.
permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt (fails if any file is unformatted)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go test ./...

  typescript:
    name: TypeScript SDK build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/*.test.js

  langgraph-example:
    name: LangGraph example build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: examples/langgraph-ts/package-lock.json

      # The example consumes @readproof/sdk as a file: dependency, so the SDK's
      # dist/ has to exist before its own build can resolve the types.
      - name: Build the SDK the example depends on
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Build the example (build only — running it needs a live readproofd)
        working-directory: examples/langgraph-ts
        run: |
          npm ci
          npm run build

  support-agent-example:
    name: Support agent example build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The example's tests build readproof and readproofd themselves and
      # run a throwaway readproofd on a free port, so this job needs the Go
      # toolchain too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: examples/support-agent/package-lock.json

      - name: Build the SDK the example depends on
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Build the example
        working-directory: examples/support-agent
        run: |
          npm ci
          npm run build

      # SUPPORT_FAKE_MODEL swaps in a deterministic answer function, so the
      # whole suite runs with no Ollama and no network beyond localhost.
      - name: Test the example (deterministic fake model, no Ollama)
        working-directory: examples/support-agent
        env:
          SUPPORT_FAKE_MODEL: "1"
        run: npm test

  integration:
    name: Docker Compose integration (Postgres + MinIO + readproofd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker compose up -d --build

      - name: Wait for readproofd to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "readproofd did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run the full test suite against the composed stack
        env:
          READPROOF_TEST_POSTGRES_DSN: postgres://readproof:readproof_dev_password@localhost:5434/readproof?sslmode=disable
          READPROOF_TEST_MINIO_ENDPOINT: localhost:9000
          READPROOF_TEST_MINIO_ACCESS_KEY: readproofadmin
          READPROOF_TEST_MINIO_SECRET_KEY: readproof_dev_password_minio
        run: go test ./...

      - name: Reference demo, driven by the CLI, against the built readproofd image
        run: |
          set -e
          go build -o /tmp/readproof ./cmd/readproof

          # A containerized readproofd has no access to the runner's
          # filesystem, so this uses an HTTP source (reachable via
          # host.docker.internal) — the same technique documented in the
          # README for local testing.
          mkdir -p /tmp/demo
          printf 'Products can be refunded within 30 days.\n' > /tmp/demo/refunds.md
          python3 -m http.server 8765 --directory /tmp/demo &
          sleep 1

          export READPROOF_SERVER_URL=http://localhost:8080
          /tmp/readproof resource add readproof://ci/policies/refunds \
            --source-type http --url http://host.docker.internal:8765/refunds.md --policy require_fresh
          /tmp/readproof run --id ci-run-a readproof://ci/policies/refunds

          printf 'Products can be refunded within 14 days.\n' > /tmp/demo/refunds.md
          /tmp/readproof run --id ci-run-b readproof://ci/policies/refunds

          /tmp/readproof diff ci-run-a ci-run-b
          /tmp/readproof replay ci-run-a | tee /tmp/replay.out
          grep -q "Replay verified: SHA256 match for 1/1 entries." /tmp/replay.out

      - name: docker compose logs (on failure)
        if: failure()
        run: docker compose logs

      - run: docker compose down -v
        if: always()
